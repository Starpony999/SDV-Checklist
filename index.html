<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stardew Valley Expanded Checklist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Stardew Valley Expanded Checklist</h1>
    <section class="controls" aria-label="Display controls">
      <label>Theme <select id="themeSelect"><option value="dark">Moonlight</option><option value="light">Sunny</option></select></label>
    </section>
  </header>
  <main class="page home-page" id="page">
    <section class="hero">
      <h2>Checklist Home</h2>
      <p>Choose a Stardew Valley Expanded checklist to track your collection progress.</p>
    </section>
    <section class="home-links" aria-label="Checklist pages">
      <a class="home-card" href="shipping.html">
        <strong>Shipping Checklist</strong>
        <span>Track SVE items shipped for collection completion.</span>
      </a>
      <a class="home-card" href="recipes.html">
        <strong>Recipes Checklist</strong>
        <span>Track SVE recipes and where each recipe comes from.</span>
      </a>
    </section>
  </main>
<script>
  themeSelect.addEventListener('change', event => document.body.classList.toggle('light', event.target.value === 'light'));
</script>
</body>
</html>
